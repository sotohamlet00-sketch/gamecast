name: Build GameCast APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Plataforma y build-tools de Android
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      # Instala Gradle 8.11.1 y cachea dependencias y wrapper entre ejecuciones
      - name: Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # El repositorio no incluye gradle-wrapper.jar: se genera aquí para poder usar ./gradlew
      - name: Generar el wrapper de Gradle
        run: gradle wrapper --gradle-version 8.11.1

      - name: Compilar APK debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: gamecast-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
